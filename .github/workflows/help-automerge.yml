name: Auto-merge help PRs

# Inbound side of the help-collection contract (see
# docs/memory/conventions/help-collection.md). Each of the 7 sibling tool repos'
# CI opens a PR into this repo that updates help/<slug>.json. This workflow can
# enable auto-merge on those PRs so they serialize and land without manual
# intervention; the existing push-to-main deploy (deploy.yml) then ships the
# updated help. No separate deploy trigger is added (Constitution IV).
#
# SAFETY MODEL — why guards, not just a path filter:
# This repo is PUBLIC, `main` is UNPROTECTED, and a merge to `main` AUTO-DEPLOYS
# (deploy.yml). The `paths: ['help/**']` filter below only controls whether this
# workflow TRIGGERS — it does NOT make a PR safe to merge. A single PR can touch
# help/** AND other paths in the same diff (a "mixed" diff), which would still
# trigger here. So enabling auto-merge unconditionally would let a mixed diff —
# or a schema-invalid help file — auto-merge and ship to production unattended.
# Auto-merge is therefore gated behind THREE guards, all of which must pass:
#   1. Content guard    — every changed file must be under help/ (else no-op).
#   2. Validation gate   — help/*.json must conform to the Zod contract schema.
#   3. Actor guard       — PR author must be the trusted producer identity.
# Only if all three pass do we enable auto-merge.
#
# Uses `pull_request` (NOT pull_request_target): fork PRs run with a read-only
# GITHUB_TOKEN and cannot self-enable auto-merge, so we never run privileged
# logic against untrusted PR head code.

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'help/**'

# Minimal permissions: enough to enable auto-merge, nothing more.
permissions:
  contents: write        # enable auto-merge
  pull-requests: write   # mark the PR auto-merge

env:
  # Guard 3 (actor): the trusted producer identity. SHLLAI_TOKEN — the secret the
  # 7 sibling repos use to open these PRs — belongs to repo owner `sahil87`, so a
  # legitimate producer PR is authored by `sahil87`. Parameterized here (not
  # buried in an expression) so it is easy to find and change.
  TRUSTED_AUTHOR: sahil87

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      # Guard 3 (actor, defense-in-depth): only PRs from the trusted producer
      # identity are eligible. Fork PRs already get a read-only token and cannot
      # self-merge; this also rejects stray/same-repo PRs from other authors
      # before any privileged work runs. Implemented as the FIRST step (gating an
      # output the later steps require) rather than a job-level `if:` so the
      # trusted login can read from the TRUSTED_AUTHOR env constant — GitHub does
      # NOT expose the `env` context in a job-level `if:`. The whole job is a
      # no-op (exit 0, PR left open) when the author is not trusted.
      - name: Actor guard — PR author must be the trusted producer
        id: actor_guard
        env:
          # Passed via env (not interpolated into the script body) to avoid any
          # shell-injection surface from the PR author field.
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          author="$PR_AUTHOR"
          if [ "$author" != "$TRUSTED_AUTHOR" ]; then
            echo "::notice::PR author '$author' is not the trusted producer '$TRUSTED_AUTHOR' — auto-merge NOT enabled. Leaving the PR open for manual review."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "PR author '$author' is the trusted producer. Proceeding to content guard."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      # Guard 1 (content): enumerate the PR's changed files and require EVERY one
      # to live under help/. A mixed diff (help/** plus, e.g., astro.config.mjs)
      # is NOT safe to merge unattended on a public/unprotected/auto-deploying
      # repo, so we exit 0 (a no-op — the PR stays OPEN for manual handling), we
      # do NOT fail the check. Listing files via `gh pr view` is independent of
      # checkout fetch-depth.
      - name: Content guard — every changed file must be under help/
        id: content_guard
        if: steps.actor_guard.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          files="$(gh pr view "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --json files --jq '.files[].path')"
          echo "Changed files in this PR:"
          echo "$files"

          outside="$(printf '%s\n' "$files" | grep -v '^help/' || true)"
          if [ -n "$outside" ]; then
            echo "::notice::PR touches paths outside help/ — auto-merge NOT enabled. Leaving the PR open for manual review:"
            printf '%s\n' "$outside"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "All changed files are under help/. Proceeding to validation."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      # Check out the PR head so the validation gate runs against the PROPOSED
      # help/*.json content. Only runs once the content guard is satisfied.
      - name: Checkout PR head
        if: steps.content_guard.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # Reuse deploy.yml's exact pnpm + Node setup so the validator runs on the
      # SAME toolchain that builds the site (pnpm 10, Node 22, pnpm cache keyed on
      # the live site's lockfile). Keeps versions consistent across workflows.
      - name: Install pnpm
        if: steps.content_guard.outputs.proceed == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        if: steps.content_guard.outputs.proceed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: sites/astro-starlight-terminal1/pnpm-lock.yaml

      - name: Install dependencies
        if: steps.content_guard.outputs.proceed == 'true'
        working-directory: sites/astro-starlight-terminal1
        run: pnpm install --frozen-lockfile

      # Guard 2 (validation): run the contract validator against the PR's
      # help/*.json. The validator (scripts/validate-help.mjs) checks every
      # help/<tool>.json at the repo root against the Zod schema and exits
      # non-zero on any failure. If a help file is schema-invalid this step FAILS
      # — which (a) blocks this workflow from reaching the enable-auto-merge step
      # and (b) shows as a failed check, so even a manual merge would be guarded.
      - name: Validation gate — help/*.json must conform to the schema
        if: steps.content_guard.outputs.proceed == 'true'
        working-directory: sites/astro-starlight-terminal1
        run: node scripts/validate-help.mjs

      # Only reached when ALL three guards pass (actor + content + validation).
      # Enable auto-merge; the existing push-to-main deploy ships the result once
      # GitHub merges the PR.
      - name: Enable auto-merge
        if: steps.content_guard.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
