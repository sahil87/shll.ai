name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '13 9 * * *'   # daily, 2h after hexokit-site's 07:13 UTC help refresh + deploy, so the
                           # byte copies of /versions.json and /install pick up that day's values

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Path to the site that ships to shll.ai. shll.ai is a permanent redirect
# host for hexokit.com (HexoKit rebrand row X2): the generator fetches the
# redirect map and byte copies from hexokit.com and fails closed — any fetch
# or validation failure stops the build, so the last-good site stays live.
env:
  SITE_DIR: sites/shll-ai-redirect-stub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build redirect stub
        working-directory: ${{ env.SITE_DIR }}
        run: node build.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
