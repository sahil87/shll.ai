name: CI

# PR + main validation for the shll.ai redirect stub (HexoKit rebrand row X2):
#   1. node --test — the hermetic unit + integration suite (synthetic map
#      fixture + in-process HTTP server; no network).
#   2. node build.mjs — the REAL build against live hexokit.com, the same
#      thing the deploy does, so a PR that would fail the deploy fails here.
#
# EXPECTED RED UNTIL X1 IS DEPLOYED: https://hexokit.com/shll-ai-redirects.json
# answers 404 while hexokit-site PR #9 is unmerged, and the build fails closed
# on that 404 by design (the unit-test step still passes). The red build step
# is the correct "do not merge yet" signal, not a bug to work around.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same ref (rapid PR pushes), but never cancel
# main — every merged commit gets a full run (same rule as run-kit).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run unit tests
        run: node --test sites/shll-ai-redirect-stub/*.test.mjs

      - name: Build redirect stub (live hexokit.com)
        working-directory: sites/shll-ai-redirect-stub
        run: node build.mjs
