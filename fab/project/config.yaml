# Full reference of all available options: fab config reference
checklist:
    extra_categories: []
project:
    description: Landing page for the shll AI coding toolkit — multi-site repo (live build under sites/, experiments in sites/_playground/)
    name: ai.shll.in
source_paths:
    - sites/astro-starlight-terminal1/src/
    - sites/astro-starlight-terminal1/scripts/
# Glob/pathspec patterns identifying test files. Used by the true-impact
# breakdown to attribute lines to tests vs. implementation (impl = total − tests).
# Language-specific — no kit default. Patterns are :(glob) magic pathspecs, so
# `**` matches across directories and `*` does NOT match `/`. Anchor to your
# language's test convention rather than a bare substring (a substring like
# `*test*` miscounts production code such as `attestation.go` or `latest.go`).
# When absent/empty, the breakdown collapses to a single total line.
#
# Examples (uncomment/adapt the line for your stack):
#   - "**/*_test.go"                  # Go   — `_test.go` suffix
#   - "**/test_*.py"                  # Python (pytest) — `test_` prefix
#   - "**/*.spec.ts"                  # JS/TS (Jest/Vitest) — `.spec` infix
#   - "**/*.test.ts"                  # JS/TS — `.test` infix
#   - "**/src/test/**"                # Java/Kotlin (Maven/Gradle) — test source root
# test_paths: []
true_impact_exclude:
    - fab/
    - docs/
    - sites/_playground/

# >>> fab reference (kit 2.20.8) >>> ---------------------------------------
# Overridable fields you have NOT overridden, with current defaults.
# REGENERATED by `fab config upgrade` on every upgrade — edits inside this
# fence are overwritten. To override a field: move it ABOVE the fence and
# uncomment it.
#
# test_paths — glob/pathspec patterns identifying test files, used by
# /git-pr's true-impact breakdown (impl = total − tests). No kit default. [project]
# Full prose: fab config explain test_paths
# test_paths:
#   - "**/*_test.go"                   # example (Go — `_test.go` suffix)
#
# consolidate.detectors — duplicate-detection commands /fab-dedupe runs to
# seed its sweep; {paths} and {out} substitute at run time (shell-quoted). [project]
# Full prose: fab config explain consolidate.detectors
# consolidate:
#   detectors:
#     - jscpd --reporters json --output {out} {paths}
#
# dispatch.mode / dispatch.column_width / dispatch.reap_done — stage-dispatch
# mode (pane → native → headless, descending), the pane-worker column width
# in percent, and done-pane reaping. [both]
# Settable machine-wide: fab config set --system dispatch.mode <pane|native|headless>
#                        fab config set --system dispatch.column_width <percent>
#                        fab config set --system dispatch.reap_done <true|false>
# Full prose: fab config explain dispatch.mode
# dispatch:
#   mode: native
#   column_width: 35
#   reap_done: true
#
# agent.session / agent.workers — providers for the two agent DEPTHS: session is
# what you talk to (fab agent/operator/batch), workers is what stages dispatch
# to. agent.profiles.<role> is the sparse per-role escape hatch beneath the
# knobs. Default claude. [both]
# Settable machine-wide: fab config set --system agent.session <provider>
#                        fab config set --system agent.workers <provider>
# Full prose: fab config explain agent.session
# agent:
#   session: claude
#   workers: claude
#   # profiles:
#   #   operator: { provider: codex }    # example: coordinate from another CLI
#   #   review: { provider: codex }      # example: run just the critic elsewhere
#
# stage_hooks — optional per-stage pre/post shell commands honored by
# `fab status start` / `fab status finish`; a failing pre hook blocks start.
# Add by hand. Valid stage keys: apply, hydrate, intake, review, review-pr, ship. [project]
# Full prose: fab config explain stage_hooks
# stage_hooks:
#   apply:
#     pre: ./scripts/check-clean-tree.sh
#     post: make test
# <<< end fab reference <<< ------------------------------------------------
