agent:
    spawn_command: claude --dangerously-skip-permissions --effort xhigh -n "$(basename "$(pwd)")"
checklist:
    extra_categories: []
fab_version: 2.1.6
project:
    description: Landing page for the shll AI coding toolkit — multi-site repo (live build under sites/, experiments in sites/_playground/)
    name: ai.shll.in
source_paths:
    - sites/astro-starlight-terminal1/src/
stage_directives:
    apply:
        - Use GIVEN/WHEN/THEN for scenarios
        - Mark ambiguities with [NEEDS CLARIFICATION]
    hydrate: []
    intake: []
    review: []
true_impact_exclude:
    - fab/
    - docs/
    - sites/_playground/
